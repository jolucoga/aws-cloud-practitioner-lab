name: ShellCheck

on:
  push:
    paths: ['**.sh', '.github/workflows/shellcheck.yml']
  pull_request:
    paths: ['**.sh', '.github/workflows/shellcheck.yml']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -x
